name: Restore Upstream FS Folder Only
on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Your Source
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # Needed to push changes back to your repo

    - name: Restore Clean Upstream FS Folder
      run: |
        # 1. Nuke the broken filesystem folder completely from your workspace
        rm -rf kernel-4.9/fs
        
        # 2. Clone only the target repository metadata using sparse checkout
        git clone --depth=1 --filter=blob:none --sparse https://github.com/oppo-source/A31 temp_upstream
        cd temp_upstream
        git sparse-checkout set kernel-4.9/fs
        cd ..
        
        # 3. Move the clean stock fs folder directly into your kernel tree
        mv temp_upstream/kernel-4.9/fs kernel-4.9/
        rm -rf temp_upstream

    - name: Commit and Push Restored FS
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add kernel-4.9/fs
        
        # Check if there are actual changes to commit so the workflow doesn't crash
        if git diff-index --quiet HEAD; then
          echo "No changes detected. FS folder is already up to date."
        else
          git commit -m "System: Completely restored clean upstream stock fs folder"
          git push
        fi
