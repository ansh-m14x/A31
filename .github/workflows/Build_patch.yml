name: Sync-Oppo-A12-Imgsensor-Only

on:
  workflow_dispatch: # Allows manual trigger whenever you're ready

jobs:
  sync-drivers:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Your A31 Source
      uses: actions/checkout@v4

    - name: Replace Imgsensor Drivers
      run: |
        # Target path based on your kernel structure
        TARGET_DIR="kernel-4.9/drivers/misc/mediatek/imgsensor"
        
        # 1. Remove the existing faulty or incomplete folder
        echo "Deleting existing imgsensor folder..."
        rm -rf $TARGET_DIR
        
        # 2. Clone the KAGA-KOKO A12 source (android-9 branch)
        echo "Cloning A12 source from KAGA-KOKO..."
        git clone https://github.com/KAGA-KOKO/kernel-oppo6765 -b android-9 --depth=1 temp_a12
        
        # 3. Move the verified imgsensor folder into your tree
        echo "Moving A12 imgsensor drivers into position..."
        mkdir -p kernel-4.9/drivers/misc/mediatek/
        mv temp_a12/drivers/misc/mediatek/imgsensor kernel-4.9/drivers/misc/mediatek/
        
        # 4. Cleanup
        rm -rf temp_a12
        echo "Sync complete."

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add kernel-4.9/drivers/misc/mediatek/imgsensor
        git commit -m "Drivers: Replace imgsensor with verified Oppo A12 source" || echo "No changes to commit"
        git push
