name: Oppo-A31-Imgsensor-Sync-Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Build Packages
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
        python2 python-is-python2 git ccache automake flex lzop bison gperf \
        build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
        libbz2-dev libghc-bzlib-dev squashfs-tools pngcrush fontconfig \
        liblz4-tool make optipng maven libssl-dev pwgen bc libc6-dev-i386 \
        libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
        device-tree-compiler libncurses5 libtinfo5 wget

    - name: Download Toolchains
      run: |
        mkdir -p tools
        git clone https://github.com/KAGA-KOKO/clang-6.0.2 -b clang --depth=1 tools/clang
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b ndk-release-r16 --depth=1 tools/gcc64
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b ndk-release-r16 --depth=1 tools/gcc32

    - name: Imgsensor Folder Replacement
      run: |
        # Delete existing driver folder
        rm -rf kernel-4.9/drivers/misc/mediatek/imgsensor
        
        # Clone verified source from KAGA-KOKO
        git clone https://github.com/KAGA-KOKO/kernel-oppo6765 -b android-9 --depth=1 temp_src
        
        # Move the new imgsensor folder into your kernel tree
        mv temp_src/drivers/misc/mediatek/imgsensor kernel-4.9/drivers/misc/mediatek/
        
        # Cleanup temporary clone
        rm -rf temp_src

    - name: Global Makefile & Header Patching
      run: |
        cd kernel-4.9
        # Fix missing clang compiler header
        if [ ! -f include/linux/compiler-clang.h ]; then
          cp include/linux/compiler-gcc.h include/linux/compiler-clang.h
        fi

        # Force bypass of GPU and Driver warnings seen in logs
        find drivers/misc/mediatek -name "Makefile" -exec sed -i 's/-Werror//g' {} +
        find drivers/misc/mediatek -name "Makefile" -exec sed -i '1i ccflags-y += -Wno-error -Wno-sometimes-uninitialized -Wno-ignored-qualifiers -Wno-unused-variable -Wno-unused-function' {} +
        
        # Main Makefile flags
        sed -i '/^KBUILD_CFLAGS += -Wall/a KBUILD_CFLAGS += -Wno-error -Wno-sometimes-uninitialized -Wno-ignored-qualifiers' Makefile
        
        # Defconfig adjustments
        DEFCONFIG="arch/arm64/configs/oppo6765_19581_defconfig"
        sed -i 's/CONFIG_MTK_FLASHLIGHT_MT6370=n/CONFIG_MTK_FLASHLIGHT_MT6370=y/g' $DEFCONFIG
        sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ansh_m14x"/g' $DEFCONFIG

    - name: Compile Kernel
      run: |
        export PATH=$(pwd)/tools/clang/bin:$(pwd)/tools/gcc64/bin:$(pwd)/tools/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        cd kernel-4.9
        make O=out mrproper
        make O=out oppo6765_19581_defconfig
        
        make -j$(nproc) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error -Wno-sometimes-uninitialized -Wno-ignored-qualifiers" \
            Image.gz-dtb

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Oppo-A31-Kernel-Synced
        path: kernel-4.9/out/arch/arm64/boot/Image.gz-dtb
